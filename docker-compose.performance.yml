name: humans-performance

# Disposable host-port override for the opt-in reference performance run.
# Keep this file paired with docker-compose.yml and use a unique project name;
# every data volume is tmpfs-backed and is discarded when the project is down.
services:
  app:
    environment:
      # The reference workload exercises 20 concurrent authenticated readers.
      # Keep one Postgres slot available per reader so the harness measures
      # graph query execution instead of default pool queueing.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}

  postgres:
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:${PERF_POSTGRES_PORT:-55441}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql

  redis:
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:${PERF_REDIS_PORT:-6381}:6379"
    volumes:
      - type: tmpfs
        target: /data

  minio:
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:${PERF_MINIO_PORT:-9004}:9000"
    volumes:
      - type: tmpfs
        target: /data
