fragment PersonSummary on Person {
  id
  displayName
  sortName
  preferredName
  biography
  status
  sensitivity
  confidence
  confidenceExplanation
  version
  createdAt
  updatedAt
}

fragment PageDetails on PageInfo {
  endCursor
  hasNextPage
}

fragment MutationIssue on ValidationIssue {
  code
  message
  path
}

fragment FactSummary on Fact {
  id
  personId
  definitionId
  namespace
  fieldKey
  label
  valueType
  value {
    text
    decimal
    boolean
    dateStart
    dateEnd
    timestamp
    json
    referencedPersonId
    placeId
    fileId
    unit
  }
  state
  reviewState
  sensitivity
  confidence
  temporalSemantics
  temporalPrecision
  validEarliestAt
  validLatestAt
  assertedAt
  version
  createdAt
  updatedAt
}

query ResearchViewer {
  viewer {
    id
    principalId
    actorType
    role
    permissions
    workspace {
      id
      organizationId
      name
    }
  }
}

query DashboardPeople($first: Int) {
  people(first: $first) {
    nodes {
      ...PersonSummary
    }
    pageInfo {
      ...PageDetails
    }
  }
}

query PeopleList($first: Int, $after: String, $filter: PersonFilterInput) {
  people(first: $first, after: $after, filter: $filter) {
    nodes {
      ...PersonSummary
    }
    pageInfo {
      ...PageDetails
    }
  }
}

query PersonHeader($id: UUID!) {
  person(id: $id) {
    ...PersonSummary
  }
}

fragment PersonNameSummary on PersonName {
  id
  personId
  kind
  fullName
  givenName
  middleName
  familyName
  prefix
  suffix
  script
  language
  validFrom
  validUntil
  temporalSemantics
  temporalPrecision
  confidence
  sensitivity
  state
  version
  createdAt
  updatedAt
}

fragment PersonEventSummary on PersonEvent {
  id
  personId
  eventKind
  title
  description
  placeId
  earliestAt
  latestAt
  temporalSemantics
  temporalPrecision
  confidence
  sensitivity
  state
  version
  createdAt
  updatedAt
}

query PersonNamesAndEvents(
  $id: UUID!
  $namesFirst: Int
  $namesAfter: String
  $eventsFirst: Int
  $eventsAfter: String
) {
  person(id: $id) {
    id
    names(first: $namesFirst, after: $namesAfter) {
      nodes {
        ...PersonNameSummary
      }
      pageInfo {
        ...PageDetails
      }
    }
    events(first: $eventsFirst, after: $eventsAfter) {
      nodes {
        ...PersonEventSummary
      }
      pageInfo {
        ...PageDetails
      }
    }
  }
}

query PersonFacts(
  $id: UUID!
  $first: Int
  $after: String
  $contradictoryAfter: String
) {
  person(id: $id) {
    id
    facts(first: $first, after: $after) {
      nodes {
        ...FactSummary
      }
      pageInfo {
        ...PageDetails
      }
    }
    contradictoryFacts(first: $first, after: $contradictoryAfter) {
      nodes {
        ...FactSummary
      }
      pageInfo {
        ...PageDetails
      }
    }
  }
}

query PersonFieldSelections($id: UUID!, $first: Int, $after: String) {
  person(id: $id) {
    id
    fieldSelections(first: $first, after: $after) {
      nodes {
        id
        personId
        namespace
        fieldKey
        factId
        selectionReason
        version
        selectedBy {
          kind
          label
        }
        updatedAt
      }
      pageInfo {
        ...PageDetails
      }
    }
  }
}

query FactDetail(
  $id: UUID!
  $revisionFirst: Int
  $revisionAfter: String
  $evidenceFirst: Int
  $evidenceAfter: String
) {
  fact(id: $id) {
    id
    revisions(first: $revisionFirst, after: $revisionAfter) {
      nodes {
        id
        revision
        changeReason
        createdAt
        createdBy {
          kind
          label
        }
      }
      pageInfo {
        ...PageDetails
      }
    }
    evidence(first: $evidenceFirst, after: $evidenceAfter) {
      nodes {
        id
        excerpt
        locator
        supportStrength
        evidenceItem {
          id
          checksum
          reviewState
          sensitivity
          externalLocator
          source {
            id
            title
            citation
            canonicalUrl
          }
        }
      }
      pageInfo {
        ...PageDetails
      }
    }
  }
}

query FactCatalog($first: Int, $after: String) {
  factDefinitions(first: $first, after: $after, filter: { state: ACTIVE }) {
    nodes {
      id
      namespace
      fieldKey
      label
      description
      allowedValueType
      cardinality
      defaultSensitivity
      version
    }
    pageInfo {
      ...PageDetails
    }
  }
}

query PersonRelationships($id: UUID!, $first: Int, $after: String) {
  person(id: $id) {
    id
    relationships(first: $first, after: $after) {
      nodes {
        id
        relationshipTypeId
        sourcePersonId
        targetPersonId
        labelOverride
        state
        sensitivity
        confidence
        strength
        temporalSemantics
        temporalPrecision
        validFrom
        validUntil
        version
        createdAt
        updatedAt
      }
      pageInfo {
        ...PageDetails
      }
    }
  }
}

query RelationshipTypeDetail($id: UUID!) {
  relationshipType(id: $id) {
    id
    key
    forwardLabel
    inverseLabel
    directed
  }
}

query PersonIdentity($id: UUID!) {
