query PersonActivity($id: UUID!, $first: Int, $after: String) {
  auditEvents(first: $first, after: $after, filter: { resourceId: $id }) {
    nodes {
      id
      action
      outcome
      resourceKind
      resourceId
      requestId
      occurredAt
