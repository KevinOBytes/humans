query ResearchAnalysis($input: ResearchAnalysisInput!) {
  researchAnalysis(input: $input) {
    kind
    rows
    appliedFilters
    limit
    redactedFieldCount
    explanation {
      sourceRows
      returnedRows
      timeWindow
      filters
      omittedFields
      methodology
    }
  }
}

mutation PreviewImport($input: PreviewImportInput!) {
  previewImport(input: $input) {
    format
    workspaceId
    purpose
    caseId
    rows {
      rowNumber
      externalKey
      projected
      issues {
        code
        message
        rowNumber
        path
      }
      duplicateCandidateIds
    }
    schemaColumns
    provenanceDefaults
    commitToken
    expiresAt
    duplicateStrategy
    issues {
      code
      message
      rowNumber
      path
    }
  }
}

mutation PreviewExport($input: PreviewExportInput!) {
  previewExport(input: $input) {
    workspaceId
    purpose
    caseId
    redactionProfile
    rows
    fieldCounts
    approvalRequired
    previewHash
    expiresAt
    commitToken
    provenanceManifest
  }
}

mutation CommitExport($input: CommitExportInput!) {
  commitExport(input: $input) {
    id
    fileId
    caseId
    purpose
    redactionProfile
    format
    state
    rowCount
    fieldCounts
    expiresAt
    createdAt
  }
}

mutation RequestExportApproval($input: RequestExportApprovalInput!) {
  requestExportApproval(input: $input) {
    id
    workspaceId
    purpose
    caseId
    previewHash
    redactionProfile
    requestedByPrincipalId
    reviewedByPrincipalId
    state
    requestReason
    decisionReason
    expiresAt
    reviewedAt
    version
    requestAuditReference
    reviewAuditReference
    createdAt
  }
}

mutation ReviewExportApproval($input: ReviewExportApprovalInput!) {
  reviewExportApproval(input: $input) {
    id
    workspaceId
    purpose
    caseId
    previewHash
    redactionProfile
    requestedByPrincipalId
    reviewedByPrincipalId
    state
    requestReason
    decisionReason
    expiresAt
    reviewedAt
    version
    requestAuditReference
    reviewAuditReference
    createdAt
  }
}
