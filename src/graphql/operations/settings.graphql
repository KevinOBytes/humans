query SettingsAuditEvents(
  $first: Int = 25
  $after: String
  $filter: AuditEventFilterInput
) {
  auditEvents(first: $first, after: $after, filter: $filter) {
    nodes {
      action
      resourceKind
      requestId
      outcome
      occurredAt
      actor {
        kind
        label
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query SettingsPolicyPosture {
  settingsPolicyPosture {
    workspace {
      version
      name
      locale
      timezone
      defaultRetentionDays
      aiEnabled
      retainRestrictedAiPrompts
      storageEnabled
    }
    accessPolicies {
      id
      version
      name
      state
      sensitivityCeiling
      resourceKinds
    }
    resourceGrants {
      id
      policyId
      resourceId
      resourceKind
      memberId
      role
      state
      validFrom
      validUntil
      version
    }
    retentionPolicies {
      resourceKind
      retentionDays
      deletionBehavior
    }
  }
}

query SettingsOrganizationApiKeys($offset: Int) {
  settingsOrganizationApiKeys(offset: $offset) {
    nodes {
      actionId
      name
      fingerprint
      state
      scopes
      createdAt
      updatedAt
      expiresAt
      lastUsedAt
    }
    offset
    limit
    total
    hasPrevious
    hasMore
    allowedScopes
  }
}

mutation CreateOrganizationApiKey($input: CreateOrganizationApiKeyInput!) {
  createOrganizationApiKey(input: $input) {
    actionId
    code
    requestId
    secret
  }
}

mutation RotateOrganizationApiKey($input: RotateOrganizationApiKeyInput!) {
  rotateOrganizationApiKey(input: $input) {
    actionId
    code
    requestId
    secret
  }
}

mutation RevokeOrganizationApiKey($input: RevokeOrganizationApiKeyInput!) {
  revokeOrganizationApiKey(input: $input) {
    actionId
    code
    requestId
  }
}

query SettingsWorkspaceDirectory($offset: Int) {
  settingsWorkspaceDirectory(offset: $offset) {
    actorRole
    invitations {
      actionId
      email
      role
      status
      createdAt
      expiresAt
    }
    members {
      nodes {
        actionId
        displayName
        email
        role
        joinedAt
        isSelf
      }
      offset
      limit
      total
      hasPrevious
      hasMore
    }
  }
}

