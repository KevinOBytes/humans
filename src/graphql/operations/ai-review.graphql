fragment AiReviewFields on AiReviewSuggestion {
  id
  personId
  caseId
  purpose
  fieldKey
  proposedValue
  currentValue
  evidenceReferences
  confidence
  uncertainty
  provider
  model
  researchRunId
  promptPolicyVersion
  status
  version
  acceptedResourceId
  acceptedResourceKind
  acceptedFromRunId
  acceptedEvidenceReferences
  decisionReason
  reviewedBy
  reviewedAt
}
query PendingAiSuggestions($personId: UUID!, $purpose: String!, $caseId: UUID) {
  pendingAiSuggestions(
    personId: $personId
    purpose: $purpose
    caseId: $caseId
  ) {
    ...AiReviewFields
  }
}
fragment AcceptedAiResearchHistoryFields on AcceptedAiResearchHistoryItem {
  id
  personId
  caseId
  purpose
  fieldKey
  confidence
  uncertainty
  provider
  model
  promptPolicyVersion
  researchRunId
  reviewerPrincipalId
  suggestedAt
  reviewedAt
  decisionReason
  acceptedResource {
    kind
    id
    redacted
  }
  evidenceReferences {
    kind
    evidenceId
    url
    locator
    quote
    snapshotHash
    redacted
  }
}
query AcceptedAiResearchHistory(
  $personId: UUID!
  $purpose: String!
  $caseId: UUID
  $first: Int
  $after: String
) {
  acceptedAiResearchHistory(
    personId: $personId
    purpose: $purpose
    caseId: $caseId
    first: $first
    after: $after
  ) {
    nodes {
      ...AcceptedAiResearchHistoryFields
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
mutation AcceptAiSuggestion($input: AcceptAiSuggestionInput!) {
  acceptAiSuggestion(input: $input) {
    ...AiReviewFields
  }
}
mutation RejectAiSuggestion($input: RejectAiSuggestionInput!) {
  rejectAiSuggestion(input: $input) {
    ...AiReviewFields
  }
}
mutation DeferAiSuggestion($input: DeferAiSuggestionInput!) {
  deferAiSuggestion(input: $input) {
    ...AiReviewFields
  }
}
mutation ReviewAiBatch($input: AiReviewBatchInput!) {
  reviewAiBatch(input: $input) {
    ...AiReviewFields
  }
}
