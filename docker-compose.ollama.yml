services:
  app:
    environment:
      AI_PROVIDER: ollama
      AI_BASE_URL: http://ollama:11434/v1
      AI_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  worker:
    environment:
      AI_PROVIDER: ollama
      AI_BASE_URL: http://ollama:11434/v1
      AI_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.13.5@sha256:2c9595c555fd70a28363489ac03bd5bf9e7c5bdf2890373c3a830ffd7252ce6d
    profiles: ["ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - backend
      - edge

  ollama-init:
    image: ollama/ollama:0.13.5@sha256:2c9595c555fd70a28363489ac03bd5bf9e7c5bdf2890373c3a830ffd7252ce6d
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c", 'ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

volumes:
  ollama-data:
